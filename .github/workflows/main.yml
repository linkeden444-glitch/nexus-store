name: 🚀 Build Android APK (NEXUS UC Store Automated Pipeline)

on:
  push:
    branches: ["*"]
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android-apk:
    name: 🔨 Compile 64-bit Kivy Android APK
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      PIP_USER: "0"

    steps:
      - name: 1. Checkout Repository Code
        uses: actions/checkout@v4

      - name: 2. Maximize Free Disk Space
        run: |
          echo "🧹 Cleaning unused pre-installed packages to maximize runner disk space..."
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          df -h

      - name: 3. Set up Python 3.10 Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 4. Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 5. Verify & Install Ubuntu Build Dependencies
        run: |
          echo "📦 Installing C/C++ compilers, SDL2 libraries, and build tools..."
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential \
            libssl-dev \
            libffi-dev \
            python3-dev \
            python3-pip \
            python3-venv \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-mixer-dev \
            libsdl2-ttf-dev \
            zlib1g-dev \
            openjdk-17-jdk \
            git \
            unzip \
            zip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            ccache \
            libsqlite3-dev \
            libgdbm-dev \
            libreadline-dev \
            libbz2-dev \
            liblzma-dev

      - name: 6. Cache Buildozer & Android SDK/NDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: ${{ runner.os }}-buildozer-arm64-v4-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-arm64-v4-

      - name: 7. Create Isolated Python 3.10 Venv & Install Buildozer (Cython 0.29.33 & legacy-cgi)
        run: |
          python3.10 -m venv --system-site-packages venv
          echo "$GITHUB_WORKSPACE/venv/bin" >> $GITHUB_PATH
          export PATH="$GITHUB_WORKSPACE/venv/bin:$PATH"
          pip install --upgrade pip -q
          pip install "legacy-cgi" "buildozer>=1.5.0" "cython==0.29.33" "setuptools==68.2.2" virtualenv Pillow -q
          buildozer version

      - name: 8. Auto-Prepare Workspace Files & Enforce 64-bit Architecture
        run: |
          export PATH="$GITHUB_WORKSPACE/venv/bin:$PATH"
          echo "🔍 Preparing workspace files for NEXUS UC Store 64-bit APK..."

          # 1. Auto-Unzip uploaded apk_repo.zip
          for zip_file in $(find . -maxdepth 2 -iname "*.zip" 2>/dev/null); do
            echo "📦 Extracting $zip_file..."
            unzip -o "$zip_file" -d . || true
          done

          # 2. Check for subdirectories (Apk, apk, app, App) and copy files to root
          for dir_name in Apk apk app App; do
            if [ -d "$dir_name" ]; then
              echo "📂 Copying files from $dir_name/ to root..."
              cp -f -r "$dir_name"/* . 2>/dev/null || true
            fi
          done

          # 3. Locate or create buildozer.spec
          if [ ! -f "buildozer.spec" ]; then
            SPEC_FILE=$(find . -maxdepth 3 -iname "buildozer.spec" 2>/dev/null | head -n 1)
            if [ -n "$SPEC_FILE" ]; then
              echo "Found buildozer.spec at $SPEC_FILE, copying to root..."
              cp -f "$SPEC_FILE" ./buildozer.spec
            fi
          fi

          # If still missing, automatically generate verified 64-bit buildozer.spec
          if [ ! -f "buildozer.spec" ]; then
            echo "⚙️ Creating verified 64-bit (arm64-v8a) buildozer.spec..."
            cat << 'EOF' > buildozer.spec
[app]
title           = NEXUS UC Store
package.name    = nexusapp
package.domain  = com.pubg.kmo
source.dir          = .
source.include_exts = py,png,jpg,kv,atlas,json
version = 3.0.0
requirements = python3,kivy==2.3.0,requests,urllib3,certifi,charset_normalizer,idna
orientation = portrait
fullscreen  = 0
android.permissions = INTERNET,ACCESS_NETWORK_STATE,READ_EXTERNAL_STORAGE,WRITE_EXTERNAL_STORAGE,MANAGE_EXTERNAL_STORAGE
android.api     = 33
android.minapi  = 24
android.ndk     = 25b
android.ndk_api = 24
icon.filename = %(source.dir)s/icon.png
presplash.filename = %(source.dir)s/icon.png
android.archs = arm64-v8a
android.entrypoint = org.kivy.android.PythonActivity
android.release_artifact = apk

[buildozer]
log_level    = 2
warn_on_root = 1
EOF
          fi

          # Ensure 64-bit architecture is strictly enforced
          sed -i 's/android.archs = .*/android.archs = arm64-v8a/' buildozer.spec
          sed -i 's/title = .*/title = NEXUS UC Store/' buildozer.spec

          # 4. Locate main.py
          if [ ! -f "main.py" ]; then
            MAIN_FILE=$(find . -maxdepth 3 -iname "main.py" 2>/dev/null | head -n 1)
            if [ -n "$MAIN_FILE" ]; then
              echo "Found main.py at $MAIN_FILE, copying to root..."
              cp -f "$MAIN_FILE" ./main.py
            fi
          fi

          # 5. Locate or generate icon.png
          if [ ! -f "icon.png" ]; then
            ICON_FILE=$(find . -maxdepth 3 -iname "icon.png" 2>/dev/null | head -n 1)
            if [ -n "$ICON_FILE" ]; then
              cp -f "$ICON_FILE" ./icon.png
            else
              echo "Creating fallback icon.png..."
              python3 -c "from PIL import Image; Image.new('RGB', (512, 512), color=(10, 15, 30)).save('icon.png')" 2>/dev/null || touch icon.png
            fi
          fi

          echo "📋 Workspace File Verification:"
          ls -la
          echo "📋 Architecture Setting:"
          grep "android.archs" buildozer.spec || true

          # Verify that main.py is present
          if [ ! -f "main.py" ]; then
            echo ""
            echo "❌❌❌ CRITICAL ERROR ❌❌❌"
            echo "main.py is NOT present in your repository!"
            exit 1
          fi

          echo "✅ All required build files verified successfully!"

      - name: 9. Execute Buildozer Android Compilation (Pure 64-Bit arm64-v8a)
        env:
          APP_ANDROID_ACCEPT_SDK_LICENSES: "1"
          ACCEPT_SDK_LICENSE: "1"
          BUILDOZER_WARN_ON_ROOT: "0"
        run: |
          export PATH="$GITHUB_WORKSPACE/venv/bin:$PATH"
          
          if [ -n "$JAVA_HOME_17_X64" ] && [ -d "$JAVA_HOME_17_X64" ]; then
            export JAVA_HOME="$JAVA_HOME_17_X64"
          elif [ -d "/usr/lib/jvm/java-17-openjdk-amd64" ]; then
            export JAVA_HOME="/usr/lib/jvm/java-17-openjdk-amd64"
          fi
          export PATH="$JAVA_HOME/bin:$PATH"

          echo "☕ Using JAVA_HOME: $JAVA_HOME"
          java -version
          
          echo "🔨 Starting Buildozer Android 64-bit (arm64-v8a) APK compilation..."
          echo "⏱️ Build in progress..."
          
          buildozer -v android debug

      - name: 10. Verify & Check 64-Bit APK Output
        run: |
          echo "📦 Checking compiled APKs in bin/..."
          ls -la bin/
          for f in bin/*.apk; do
            if [ -f "$f" ]; then
              echo "Found APK: $f"
            fi
          done

      - name: 11. Upload Compiled 64-Bit APK Package
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NEXUS-UC-Store-v3.0.0-ARM64-64bit-APK
          path: "**/bin/*.apk"
          retention-days: 30
