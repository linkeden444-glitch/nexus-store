name: 🚀 Build Android APK (NEXUS UC Store Automated Pipeline)

on:
  push:
    branches: ["*"]
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android-apk:
    name: 🔨 Compile 64-bit Kivy Android APK
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      PIP_USER: "0"

    steps:
      - name: 1. Checkout Repository Code
        uses: actions/checkout@v4

      - name: 2. Maximize Free Disk Space
        run: |
          echo "🧹 Cleaning unused pre-installed packages to maximize runner disk space..."
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          df -h

      - name: 3. Set up Python 3.10 Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 4. Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 5. Verify & Install Ubuntu Build Dependencies
        run: |
          echo "📦 Installing C/C++ compilers, SDL2 libraries, and build tools..."
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential \
            libssl-dev \
            libffi-dev \
            python3-dev \
            python3-pip \
            python3-venv \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-mixer-dev \
            libsdl2-ttf-dev \
            zlib1g-dev \
            openjdk-17-jdk \
            git \
            unzip \
            zip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            ccache \
            libsqlite3-dev \
            libgdbm-dev \
            libreadline-dev \
            libbz2-dev \
            liblzma-dev

      - name: 6. Cache Buildozer & Android SDK/NDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: ${{ runner.os }}-buildozer-arm64-v3-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-arm64-v3-

      - name: 7. Create Isolated Python 3.10 Venv & Install Buildozer (Cython 0.29.33 & legacy-cgi)
        run: |
          python3.10 -m venv --system-site-packages venv
          echo "$GITHUB_WORKSPACE/venv/bin" >> $GITHUB_PATH
          export PATH="$GITHUB_WORKSPACE/venv/bin:$PATH"
          pip install --upgrade pip -q
          pip install "legacy-cgi" "buildozer>=1.5.0" "cython==0.29.33" "setuptools==68.2.2" virtualenv -q
          buildozer version

      - name: 8. Auto-Prepare Workspace Files & Enforce 64-bit Architecture
        run: |
          export PATH="$GITHUB_WORKSPACE/venv/bin:$PATH"
          echo "🔍 Preparing workspace files for NEXUS UC Store 64-bit APK..."

          # Prioritize Apk/ folder first, then app/
          if [ -d "Apk" ]; then
            echo "📂 Copying files from Apk/ subfolder to root..."
            cp -f -r Apk/* . || true
          elif [ -d "app" ]; then
            echo "📂 Copying files from app/ subfolder to root..."
            cp -f -r app/* . || true
          fi

          # Unzip app.zip if present as fallback
          if [ -f "app.zip" ]; then
            echo "📦 Unzipping app.zip if needed..."
            unzip -o app.zip -d . || true
          fi

          # Ensure buildozer.spec and main.py are in root
          if [ ! -f "buildozer.spec" ]; then
            SPEC_FILE=$(find . -maxdepth 3 -name "buildozer.spec" | head -n 1)
            if [ -n "$SPEC_FILE" ]; then
              cp -f "$SPEC_FILE" ./buildozer.spec
            fi
          fi

          if [ ! -f "main.py" ]; then
            MAIN_FILE=$(find . -maxdepth 3 -name "main.py" | head -n 1)
            if [ -n "$MAIN_FILE" ]; then
              cp -f "$MAIN_FILE" ./main.py
            fi
          fi

          # Guarantee icon.png exists in root
          if [ ! -f "icon.png" ]; then
            ICON_FILE=$(find . -maxdepth 3 -name "icon.png" | head -n 1)
            if [ -n "$ICON_FILE" ]; then
              cp -f "$ICON_FILE" ./icon.png
            fi
          fi

          # STRICT 64-BIT ENFORCEMENT:
          # Ensure android.archs = arm64-v8a so Android NEVER triggers the 32-bit warning!
          sed -i 's/android.archs = .*/android.archs = arm64-v8a/' buildozer.spec
          sed -i 's/title = .*/title = NEXUS UC Store/' buildozer.spec

          echo "📋 Final Workspace File Verification:"
          ls -la
          echo "📋 buildozer.spec architecture setting:"
          grep "android.archs" buildozer.spec || true

          assert_file() {
            if [ ! -f "$1" ]; then
              echo "❌ CRITICAL ERROR: Required file $1 is missing from repository!"
              exit 1
            fi
            echo "  ✅ Verified: $1"
          }

          assert_file "buildozer.spec"
          assert_file "main.py"
          assert_file "icon.png"

      - name: 9. Execute Buildozer Android Compilation (Pure 64-Bit arm64-v8a)
        env:
          APP_ANDROID_ACCEPT_SDK_LICENSES: "1"
          ACCEPT_SDK_LICENSE: "1"
          BUILDOZER_WARN_ON_ROOT: "0"
        run: |
          export PATH="$GITHUB_WORKSPACE/venv/bin:$PATH"
          
          if [ -n "$JAVA_HOME_17_X64" ] && [ -d "$JAVA_HOME_17_X64" ]; then
            export JAVA_HOME="$JAVA_HOME_17_X64"
          elif [ -d "/usr/lib/jvm/java-17-openjdk-amd64" ]; then
            export JAVA_HOME="/usr/lib/jvm/java-17-openjdk-amd64"
          fi
          export PATH="$JAVA_HOME/bin:$PATH"

          echo "☕ Using JAVA_HOME: $JAVA_HOME"
          java -version
          
          echo "🔨 Starting Buildozer Android 64-bit (arm64-v8a) APK compilation..."
          echo "⏱️ Build in progress..."
          
          buildozer -v android debug

      - name: 10. Verify & Check 64-Bit APK Output
        run: |
          echo "📦 Checking compiled APKs in bin/..."
          ls -la bin/
          for f in bin/*.apk; do
            if [ -f "$f" ]; then
              echo "Found APK: $f"
            fi
          done

      - name: 11. Upload Compiled 64-Bit APK Package
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NEXUS-UC-Store-v3.0.0-ARM64-64bit-APK
          path: "**/bin/*.apk"
          retention-days: 30
