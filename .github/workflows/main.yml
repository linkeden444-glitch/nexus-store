name: Build Android APK (NEXUS UC Store Automated Pipeline)

on:
  push:
    branches: ["*"]
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android-apk:
    name: Compile Universal (32-bit & 64-bit) Kivy Android APK
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: 1. Checkout Repository Code
        uses: actions/checkout@v4

      - name: 2. Maximize Free Disk Space
        run: |
          echo "Cleaning unused packages to maximize runner disk space..."
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: 3. Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. Set up Python 3.11 Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 5. Install System Build Dependencies
        run: |
          echo "Installing system build dependencies..."
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential \
            git \
            zip \
            unzip \
            curl \
            ccache \
            cmake \
            libffi-dev \
            libssl-dev \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-mixer-dev \
            libsdl2-ttf-dev \
            libsqlite3-dev \
            zlib1g-dev \
            pkg-config \
            autoconf \
            automake \
            libtool \
            patch

      - name: 6. Cache Buildozer Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.buildozer/cache
          key: ${{ runner.os }}-buildozer-cache-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-cache-

      - name: 7. Install Buildozer & Dependencies in Isolated Environment
        run: |
          python3.11 -m venv /tmp/buildozer_venv
          echo "/tmp/buildozer_venv/bin" >> $GITHUB_PATH
          echo "VIRTUAL_ENV=/tmp/buildozer_venv" >> $GITHUB_ENV
          echo "PIP_USER=0" >> $GITHUB_ENV
          echo "PIP_NO_INPUT=1" >> $GITHUB_ENV

          source /tmp/buildozer_venv/bin/activate
          export VIRTUAL_ENV="/tmp/buildozer_venv"
          export PIP_USER=0
          export PIP_NO_INPUT=1

          pip install --upgrade pip setuptools wheel
          pip install "buildozer>=1.5.0" "cython<3.1.0" virtualenv Pillow "python-for-android==2024.1.21"
          pip install appdirs "colorama>=0.3.3" jinja2 "sh>=2,<3.0" meson ninja build toml packaging "wheel~=0.43.0"
          buildozer version

      - name: 8. Prepare Workspace Files & Verify Config
        run: |
          source /tmp/buildozer_venv/bin/activate
          export VIRTUAL_ENV="/tmp/buildozer_venv"
          export PIP_USER=0
          export PATH="/tmp/buildozer_venv/bin:$PATH"
          echo "Preparing files for NEXUS UC Store Universal APK compilation..."

          # Only copy files from subdirectories IF they are missing in root
          if [ ! -f "main.py" ]; then
            for dir_name in Apk apk app App; do
              if [ -f "$dir_name/main.py" ]; then
                echo "Copying main.py from $dir_name/ to root..."
                cp -f "$dir_name/main.py" ./main.py
                break
              fi
            done
          fi

          if [ ! -f "icon.png" ]; then
            for dir_name in Apk apk app App; do
              if [ -f "$dir_name/icon.png" ]; then
                echo "Copying icon.png from $dir_name/ to root..."
                cp -f "$dir_name/icon.png" ./icon.png
                break
              fi
            done
          fi

          if [ ! -f "buildozer.spec" ]; then
            for dir_name in Apk apk app App; do
              if [ -f "$dir_name/buildozer.spec" ]; then
                echo "Copying buildozer.spec from $dir_name/ to root..."
                cp -f "$dir_name/buildozer.spec" ./buildozer.spec
                break
              fi
            done
          fi

          # Strictly verify and convert icon.png to genuine PNG format
          python3 -c "
          from PIL import Image
          import os

          if os.path.exists('icon.png'):
              img = Image.open('icon.png').convert('RGBA')
              img.save('icon.png', 'PNG')
              print('icon.png converted/verified as genuine PNG format.')
              with open('icon.png', 'rb') as f:
                  assert f.read(8) == b'\x89PNG\r\n\x1a\n', 'Invalid PNG signature'
          else:
              print('WARNING: icon.png not found, creating placeholder PNG...')
              img = Image.new('RGBA', (512, 512), color=(15, 23, 42, 255))
              img.save('icon.png', 'PNG')
          "

          # Enforce Universal ARM architecture (32-bit armeabi-v7a + 64-bit arm64-v8a)
          sed -i 's/android.archs = .*/android.archs = arm64-v8a, armeabi-v7a/' buildozer.spec
          if ! grep -q "^title" buildozer.spec; then
            sed -i '/\[app\]/a title = Nexus UC Store' buildozer.spec
          fi
          sed -i 's/android.api = .*/android.api = 33/' buildozer.spec
          sed -i 's/android.minapi = .*/android.minapi = 24/' buildozer.spec
          sed -i 's/android.ndk = .*/android.ndk = 25b/' buildozer.spec
          sed -i 's/android.ndk_api = .*/android.ndk_api = 24/' buildozer.spec

          if grep -q "android.build_tools_version" buildozer.spec; then
            sed -i 's/android.build_tools_version = .*/android.build_tools_version = 33.0.2/' buildozer.spec
          else
            echo "android.build_tools_version = 33.0.2" >> buildozer.spec
          fi

          sed -i 's/requirements = .*/requirements = python3,kivy==2.3.0,requests,urllib3,certifi,chardet,idna,openssl/' buildozer.spec

          if grep -q "p4a.branch" buildozer.spec; then
            sed -i 's/p4a.branch = .*/p4a.branch = v2024.01.21/' buildozer.spec
          else
            sed -i '/\[app\]/a p4a.branch = v2024.01.21' buildozer.spec
          fi

          if ! grep -q "android.skip_update" buildozer.spec; then
            sed -i '/\[app\]/a android.skip_update = True' buildozer.spec
          else
            sed -i 's/android.skip_update = .*/android.skip_update = True/' buildozer.spec
          fi

          if ! grep -q "android.accept_sdk_license" buildozer.spec; then
            echo "android.accept_sdk_license = True" >> buildozer.spec
          fi

          if grep -q "source.exclude_dirs" buildozer.spec; then
            sed -i 's/source.exclude_dirs = .*/source.exclude_dirs = tests, bin, venv, .buildozer, .git, .github, website, Apk, app/' buildozer.spec
          else
            echo "source.exclude_dirs = tests, bin, venv, .buildozer, .git, .github, website, Apk, app" >> buildozer.spec
          fi

          if grep -q "source.exclude_exts" buildozer.spec; then
            sed -i 's/source.exclude_exts = .*/source.exclude_exts = spec, pyc, zip, md, yml, yaml, txt, cfg/' buildozer.spec
          else
            echo "source.exclude_exts = spec, pyc, zip, md, yml, yaml, txt, cfg" >> buildozer.spec
          fi

          echo "Final buildozer.spec parameters:"
          grep -E "android.archs|title|requirements|android.accept_sdk_license|android.build_tools_version|source.exclude_dirs" buildozer.spec

      - name: 9. Setup Android SDK/NDK & Execute Buildozer Compilation
        env:
          APP_ANDROID_ACCEPT_SDK_LICENSES: "1"
          ACCEPT_SDK_LICENSE: "1"
          BUILDOZER_WARN_ON_ROOT: "0"
          PIP_USER: "0"
          PIP_NO_INPUT: "1"
          VIRTUAL_ENV: "/tmp/buildozer_venv"
          GRADLE_OPTS: "-Xmx4096m -Dorg.gradle.jvmargs=-Xmx4096m"
        run: |
          source /tmp/buildozer_venv/bin/activate
          export VIRTUAL_ENV="/tmp/buildozer_venv"
          export PIP_USER=0
          export PIP_NO_INPUT=1
          export PATH="/tmp/buildozer_venv/bin:$PATH"

          sudo chown -R runner:runner /usr/local/lib/android/sdk
          export ANDROID_HOME="/usr/local/lib/android/sdk"
          export ANDROID_SDK_ROOT="/usr/local/lib/android/sdk"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"

          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2"
          rm -rf "$ANDROID_HOME/build-tools/37*" "$ANDROID_HOME/build-tools/35*" 2>/dev/null || true

          BUILDOZER_SDK="$HOME/.buildozer/android/platform/android-sdk"
          mkdir -p "$BUILDOZER_SDK"
          ln -sfn "$ANDROID_HOME/cmdline-tools" "$BUILDOZER_SDK/cmdline-tools"
          ln -sfn "$ANDROID_HOME/cmdline-tools/latest" "$BUILDOZER_SDK/tools"
          ln -sfn "$ANDROID_HOME/platform-tools" "$BUILDOZER_SDK/platform-tools"
          ln -sfn "$ANDROID_HOME/platforms" "$BUILDOZER_SDK/platforms"
          ln -sfn "$ANDROID_HOME/build-tools" "$BUILDOZER_SDK/build-tools"

          mkdir -p "$BUILDOZER_SDK/licenses" "$ANDROID_HOME/licenses"
          printf "8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n" > "$BUILDOZER_SDK/licenses/android-sdk-license"
          printf "84831b9409646a918e30573bab4c9c91346d8abd\n" > "$BUILDOZER_SDK/licenses/android-sdk-preview-license"
          cp -r "$BUILDOZER_SDK/licenses"/* "$ANDROID_HOME/licenses/" 2>/dev/null || true

          NDK_DIR="$HOME/.buildozer/android/platform/android-ndk-r25b"
          if [ ! -d "$NDK_DIR" ]; then
            SYSTEM_NDK_25=$(ls -d /usr/local/lib/android/sdk/ndk/25* 2>/dev/null | head -n 1)
            mkdir -p "$HOME/.buildozer/android/platform"
            if [ -n "$SYSTEM_NDK_25" ] && [ -d "$SYSTEM_NDK_25" ]; then
              ln -sfn "$SYSTEM_NDK_25" "$NDK_DIR"
            else
              curl -s -L -o /tmp/ndk25b.zip "https://dl.google.com/android/repository/android-ndk-r25b-linux.zip"
              unzip -q /tmp/ndk25b.zip -d "$HOME/.buildozer/android/platform"
              rm -f /tmp/ndk25b.zip
            fi
          fi

          export ANDROID_NDK_HOME="$NDK_DIR"
          export ANDROID_NDK="$NDK_DIR"
          export ANDROIDNDK="$NDK_DIR"
          export NDK_HOME="$NDK_DIR"

          sed -i '/^android.sdk_path/d' buildozer.spec
          sed -i '/^android.ndk_path/d' buildozer.spec
          sed -i "/\[app\]/a android.sdk_path = $BUILDOZER_SDK" buildozer.spec
          sed -i "/\[app\]/a android.ndk_path = $NDK_DIR" buildozer.spec

          mkdir -p ~/.android
          touch ~/.android/repositories.cfg

          echo "Starting Buildozer compilation (Universal arm64-v8a + armeabi-v7a)..."
          buildozer -v android debug || {
            echo "::warning::Buildozer first attempt encountered a network timeout or error. Retrying..."
            tail -n 60 ~/.buildozer/logs/* 2>/dev/null || true
            tail -n 60 .buildozer/logs/* 2>/dev/null || true
            buildozer -v android debug
          }

      - name: 10. Verify & Check Universal APK Output
        run: |
          echo "Checking compiled APK in bin/ directory..."
          ls -la bin/ || true
          APK_COUNT=0
          for f in bin/*.apk; do
            if [ -f "$f" ]; then
              APK_COUNT=$((APK_COUNT + 1))
              echo "Successfully generated APK: $f"
              ls -lh "$f"
              sha256sum "$f"
              mv "$f" "bin/NEXUS-UC-Store-Universal-v1.0.0.apk"
              break
            fi
          done

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "CRITICAL ERROR: No .apk binary found in bin/ directory!"
            exit 1
          fi
          echo "Final verified output APK: bin/NEXUS-UC-Store-Universal-v1.0.0.apk"
          ls -lh bin/

      - name: 11. Upload Compiled Universal APK Package
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: NEXUS-UC-Store-v1.0.0-Universal-APK
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 30
